; ================================================================
;  PlatformIO Project — ESP32 Two-Way Chat Communicator
; ================================================================
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    nrf24/RF24      @ ^1.6.0
    ; Wire and SPI are part of the ESP32 Arduino core – no entry needed.

; ──────────────────────────────────────────────────────────────────
;  TFT_eSPI driver configuration for ST7735S 128×160
;
;  Setting USER_SETUP_LOADED=1 instructs TFT_eSPI to skip loading
;  its own library-side User_Setup.h and use these build flags
;  as the sole source of configuration.  This is the recommended
;  PlatformIO approach – no library files need to be edited.
;
;  ALL pin numbers here must match the #define PIN_TFT_* values
;  in main.cpp.  If they disagree the display will not initialise.
; ──────────────────────────────────────────────────────────────────
build_flags =

    ; ── Bypass the library's User_Setup.h ────────────────────────
    -DUSER_SETUP_LOADED=1

    ; ── Select driver chip ───────────────────────────────────────
    -DST7735_DRIVER=1

    ; ── Screen resolution ────────────────────────────────────────
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160

    ; ── SPI data pins (VSPI bus) ─────────────────────────────────
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_MISO=19       ; Not used for write-only TFT, defined for completeness

    ; ── Control pins ─────────────────────────────────────────────
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17

    ; ── Fonts to include ─────────────────────────────────────────
    -DLOAD_GLCD=1       ; Font 1: 6×8 GLCD – the primary font for this project
    -DLOAD_FONT2=1      ; Font 2: 7-segment style, loaded for future use

    ; ── SPI clock frequencies ────────────────────────────────────
    -DSPI_FREQUENCY=27000000         ; 27 MHz write clock
    -DSPI_READ_FREQUENCY=5000000     ; 5  MHz read  clock

    ; ── Colour-order / inversion tweaks (module-dependent) ───────
    ; Most 128×160 ST7735S modules work without these.
    ; If red appears blue (or vice-versa), uncomment the BGR line.
    ; If the whole image looks like a photographic negative, uncomment
    ; the inversion line.  Try BGR first; both together is rare.
    ;
    ; -DTFT_RGB_ORDER=TFT_BGR
    ; -DTFT_INVERSION_ON=1

    ; ── Compiler ─────────────────────────────────────────────────
    -DCORE_DEBUG_LEVEL=0